[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clumpycells"
version = "0.1.0"
description = "Spatial mark cross-correlation analysis with cell-size correction for spatial omics data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Schwartz Lab" }
]
keywords = ["spatial omics", "mark correlation", "cell biology", "image analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "altair>=5,<6",
    "bayesian-optimization>=2,<3",
    "dtreeviz>=2,<3",
    "graphviz>=0.20,<1",
    "lifelines>=0.30,<1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "permute>=0.2,<0.3",
    "plotly>=5,<7",
    "PyWavelets>=1.5",
    "scikit-learn>=1.4",
    "scikit-survival>=0.23",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "streamlit>=1.35",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=5",
]

[project.scripts]
clumpycells = "clumpycells_cli:main"
clumpycells-gui = "ClumPyCells.app:main"

[project.urls]
Homepage = "https://github.com/schwartzlab-methods/ClumPyCells"
Preprint = "https://www.biorxiv.org/content/10.64898/2026.03.26.714529v1"

[tool.setuptools]
py-modules = ["clumpycells_cli", "streamlit_app"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ClumPyCells*"]
